[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citecraft"
version = "0.1.0"
description = "CiteCraft research agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[project.scripts]
citecraft = "src.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
